name: Steam Spiele aktualisieren

on:
  push:
    paths:
      - "games.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-games:
    runs-on: ubuntu-latest

    steps:

      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Steam-Daten abrufen
        run: |
          python <<'PY'
          import json
          import urllib.request
          import time

          with open("games.json", "r", encoding="utf-8") as f:
              games = json.load(f)

          result = []

          print(f"Gefundene AppIDs: {len(games)}")
          print("=" * 60)

          for entry in games:
              appid = entry["appid"]

              print()
              print(f"Lade Steam-Daten für AppID {appid}...")
              
              url = (
                  "https://store.steampowered.com/api/appdetails"
                  f"?appids={appid}&l=german&random=12345"
              )

              try:
                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36"
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:
                      raw_data = response.read().decode("utf-8")
                      data = json.loads(raw_data)

                  app = data.get(str(appid))

                  if not app:
                      print(f"FEHLER: Keine Antwort für AppID {appid}")
                      print(f"Steam-Antwort: {data}")
                      continue

                  if not app.get("success"):
                      print(f"FEHLER: Steam meldet success=false für AppID {appid}")
                      print(f"Steam-Antwort: {app}")
                      continue

                  game = app["data"]

                  print(f"OK: {game.get('name')}")

                  price_overview = game.get("price_overview")

                  if price_overview:
                      print(
                          f"Preis: "
                          f"{price_overview.get('final_formatted')} "
                          f"(Rabatt: "
                          f"{price_overview.get('discount_percent', 0)}%)"
                      )
                  else:
                      print("Preis: nicht verfügbar")

                  result.append({
                      "appid": appid,
                      "name": game.get("name"),
                      "type": game.get("type"),
                      "header_image": game.get("header_image"),
                      "short_description": game.get("short_description"),
                      "developers": game.get("developers", []),
                      "publishers": game.get("publishers", []),
                      "genres": [
                          genre["description"]
                          for genre in game.get("genres", [])
                      ],
                      "release_date": game.get(
                          "release_date", {}
                      ).get("date"),

                      "price": {
                          "original": price_overview.get(
                              "initial_formatted"
                          ),
                          "current": price_overview.get(
                              "final_formatted"
                          ),
                          "discount_percent": price_overview.get(
                              "discount_percent",
                              0
                          )
                      } if price_overview else None,

                      "steam_url":
                          f"https://store.steampowered.com/app/{appid}/"
                  })

              except Exception as e:
                  print(
                      f"FEHLER bei AppID {appid}: "
                      f"{type(e).__name__}: {e}"
                  )

              time.sleep(1)

          print()
          print("=" * 60)
          print(
              f"Erfolgreich geladen: "
              f"{len(result)} von {len(games)} Spielen"
          )

          if len(result) != len(games):
              print(
                  f"FEHLER: "
                  f"{len(games) - len(result)} Spiele konnten "
                  f"nicht geladen werden."
              )

          with open(
              "games-data.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("games-data.json wurde erstellt.")
          PY

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add games-data.json

          git diff --cached --quiet || git commit -m "Spieldaten aktualisieren"

          git push
