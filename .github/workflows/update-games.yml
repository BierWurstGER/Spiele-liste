name: Steam Spiele aktualisieren

on:
  push:
    paths:
      - "games.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-games:
    runs-on: ubuntu-latest

    steps:

      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Steam-Daten abrufen
        run: |
          python <<'PY'
          import json
          import urllib.request
          import time

          with open("games.json", "r", encoding="utf-8") as f:
              games = json.load(f)

          result = []

          print("=" * 60)
          print(f"Gefundene AppIDs: {len(games)}")
          print("=" * 60)

          for entry in games:
              appid = entry["appid"]

              print()
              print("-" * 60)
              print(f"Angefragt: {appid}")

              url = (
                  "https://store.steampowered.com/api/appdetails"
                  f"?appids={appid}&cc=de&l=german"
              )

              try:
                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": (
                              "Mozilla/5.0 "
                              "(Windows NT 10.0; Win64; x64) "
                              "AppleWebKit/537.36 "
                              "(KHTML, like Gecko) "
                              "Chrome/131.0 Safari/537.36"
                          ),
                          "Accept": "application/json,text/plain,*/*",
                          "Accept-Language": "de-DE,de;q=0.9,en;q=0.8"
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:
                      raw_data = response.read().decode("utf-8")

                  data = json.loads(raw_data)

                  print(f"Steam-Antwort-Schlüssel: {list(data.keys())}")

                  app = data.get(str(appid))

                  if not app:
                      print(
                          f"FEHLER: Kein direkter Eintrag "
                          f"für AppID {appid}"
                      )

                      print("Suche nach steam_appid...")

                      for key, candidate in data.items():
                          if not isinstance(candidate, dict):
                              continue

                          candidate_data = candidate.get("data")

                          if not isinstance(candidate_data, dict):
                              continue

                          steam_appid = candidate_data.get("steam_appid")

                          print(
                              f"  Schlüssel {key} "
                              f"-> steam_appid: {steam_appid}"
                          )

                          if steam_appid == appid:
                              app = candidate
                              print(
                                  f"Treffer gefunden unter Schlüssel {key}"
                              )
                              break

                  if not app:
                      print(
                          f"FEHLER: Keine passenden Steam-Daten "
                          f"für {appid}"
                      )
                      continue

                  if not app.get("success"):
                      print(
                          f"FEHLER: Steam meldet success=false "
                          f"für {appid}"
                      )
                      continue

                  game = app.get("data")

                  if not isinstance(game, dict):
                      print("FEHLER: Keine gültigen Spieldaten")
                      continue

                  steam_appid = game.get("steam_appid")
                  name = game.get("name")

                  print(f"Steam AppID: {steam_appid}")
                  print(f"Name: {name}")

                  if steam_appid != appid:
                      print(
                          "WARNUNG: Die Steam AppID stimmt "
                          "nicht mit der angefragten AppID überein!"
                      )

                  price_overview = game.get("price_overview")

                  if price_overview:
                      print(
                          f"Preis: "
                          f"{price_overview.get('final_formatted')}"
                      )
                      print(
                          f"Rabatt: "
                          f"{price_overview.get('discount_percent', 0)}%"
                      )
                  else:
                      print("Preis: nicht verfügbar")

                  result.append({
                      "appid": appid,
                      "name": name,
                      "type": game.get("type"),
                      "header_image": game.get("header_image"),
                      "short_description": game.get(
                          "short_description"
                      ),
                      "developers": game.get("developers", []),
                      "publishers": game.get("publishers", []),
                      "genres": [
                          genre.get("description")
                          for genre in game.get("genres", [])
                      ],
                      "release_date": game.get(
                          "release_date", {}
                      ).get("date"),

                      "price": {
                          "original": price_overview.get(
                              "initial_formatted"
                          ),
                          "current": price_overview.get(
                              "final_formatted"
                          ),
                          "discount_percent": price_overview.get(
                              "discount_percent", 0
                          )
                      } if price_overview else None,

                      "steam_url":
                          f"https://store.steampowered.com/app/{appid}/"
                  })

              except Exception as e:
                  print(
                      f"FEHLER bei AppID {appid}: "
                      f"{type(e).__name__}: {e}"
                  )

              time.sleep(2)

          print()
          print("=" * 60)
          print(
              f"Erfolgreich geladen: "
              f"{len(result)} von {len(games)} Spielen"
          )
          print("=" * 60)

          with open(
              "games-data.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("games-data.json wurde erstellt.")
          PY

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add games-data.json

          git diff --cached --quiet || git commit -m "Spieldaten aktualisieren"

          git push
