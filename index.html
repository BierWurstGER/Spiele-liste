<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsere Gaming-Wunschliste 🎮</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #262626;
            --text-color: #ffffff;
            --accent-color: #10b981;
            --steam-color: #171a21;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }
        
        /* Passwort-Bereich Styling */
        #login-container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 350px;
            width: 100%;
        }
        #login-container h2 {
            margin-top: 0;
            color: var(--accent-color);
        }
        #password-input {
            width: 80%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #444;
            background-color: #1a1a1a;
            color: white;
            border-radius: 5px;
            text-align: center;
            font-size: 1rem;
        }
        #login-btn {
            background-color: var(--accent-color);
            color: #1a1a1a;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 86%;
            font-size: 1rem;
        }
        #login-btn:hover {
            background-color: #059669;
        }
        #error-msg {
            color: #ef4444;
            margin-top: 10px;
            font-size: 0.9rem;
            display: none;
        }

        /* Webseiten-Inhalt (Standardmäßig versteckt) */
        #content {
            display: none;
            width: 100%;
            max-width: 1000px;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-bottom: 5px;
            color: var(--accent-color);
        }
        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background-color: #333;
        }
        .card-content {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-title {
            font-size: 1.2rem;
            margin: 0 0 15px 0;
            font-weight: 600;
        }
        .steam-btn {
            display: inline-block;
            background-color: var(--steam-color);
            color: #fff;
            text-decoration: none;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: bold;
            border: 1px solid #3d4450;
        }
    </style>
</head>
<body>

    <!-- 1. DAS PASSWORT-FENSTER -->
    <div id="login-container">
        <h2>Streng geheim! 🔒</h2>
        <p>Gib das Passwort ein, um die Spieleliste zu sehen.</p>
        <input type="password" id="password-input" placeholder="Passwort eingeben">
        <button id="login-btn" onclick="checkPassword()">Einloggen</button>
        <p id="error-msg">Falsches Passwort! Versuchs nochmal. ❌</p>
    </div>

    <!-- 2. DER EIGENTLICHE INHALT (Erst nach Login sichtbar) -->
    <div id="content">
        <h1>Unsere Gaming-Wunschliste 🎮</h1>
        <p class="subtitle">Spiele, die wir zusammen zocken müssen</p>

        <div class="grid">
            <!-- Beispiel Spiel 1 -->
            <div class="card">
                <img src="https://unsplash.com" alt="Spiel Cover">
                <div class="card-content">
                    <h3 class="card-title">Beispiel Spiel 1 (Co-Op)</h3>
                    <a href="https://steampowered.com" target="_blank" class="steam-btn">➔ Auf Steam ansehen</a>
                </div>
            </div>

            <!-- Beispiel Spiel 2 -->
            <div class="card">
                <img src="https://unsplash.com" alt="Spiel Cover">
                <div class="card-content">
                    <h3 class="card-title">Beispiel Spiel 2</h3>
                    <a href="https://steampowered.com" target="_blank" class="steam-btn">➔ Auf Steam ansehen</a>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. DAS LOGIK-SKRIPT -->
    <script>
        function checkPassword() {
            const input = document.getElementById('password-input').value;
            const loginContainer = document.getElementById('login-container');
            const content = document.getElementById('content');
            const errorMsg = document.getElementById('error-msg');

            // HIER KANST DU DEIN WUNSCH-PASSWORT ÄNDERN (Aktuell: "gaming")
            if (input === "gaming") {
                // Login erfolgreich
                loginContainer.style.display = "none"; // Login-Box ausblenden
                content.style.display = "flex";       // Liste einblenden
                document.body.style.justifyContent = "flex-start"; // Layout anpassen
            } else {
                // Falsches Passwort
                errorMsg.style.display = "block";
            }
        }

        // Erlaubt das Abschicken mit der Enter-Taste
        document.getElementById('password-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });
    </script>

</body>
</html>
