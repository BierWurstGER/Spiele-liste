<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsere Gaming-Wunschliste 🎮</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 100%);
            --panel-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.2);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
            box-sizing: border-box;
        }
        #login-container {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            max-width: 380px;
            width: 100%;
        }
        #password-input {
            width: 100%;
            padding: 14px;
            margin: 15px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.6);
            color: white;
            border-radius: 12px;
            text-align: center;
            box-sizing: border-box;
        }
        #login-btn {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 14px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px var(--accent-glow);
        }
        #error-msg { color: #f87171; margin-top: 15px; display: none; }
        #content { display: none; width: 100%; max-width: 1100px; flex-direction: column; align-items: center; }
        h1 { font-size: 2.5rem; margin: 0 0 8px 0; background: linear-gradient(to right, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: var(--text-muted); margin-bottom: 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; width: 100%; }
        .card {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s;
            position: relative;
        }
        .card:hover { transform: translateY(-8px); border-color: rgba(255, 255, 255, 0.15); }
        .image-wrapper { position: relative; width: 100%; height: 160px; background: #1e293b; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .discount-badge { position: absolute; top: 12px; left: 12px; background: #ef4444; color: white; padding: 4px 8px; font-weight: 800; border-radius: 6px; font-size: 0.85rem; }
        .card-content { padding: 24px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 1.35rem; margin: 0 0 12px 0; font-weight: 700; }
        .tags-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
        .tag { background: rgba(255, 255, 255, 0.06); color: #cbd5e1; padding: 4px 10px; border-radius: 99px; font-size: 0.75rem; }
        .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 15px; }
        .current-price { font-size: 1.25rem; font-weight: 700; }
        .current-price.sale { color: #4ade80; }
        .coming-soon-price { font-size: 0.95rem; color: var(--text-muted); font-style: italic; }
        .steam-btn { background: #212429; color: #f8fafc; text-decoration: none; padding: 10px 16px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body>

    <!-- 1. PASSWORT-BEREICH -->
    <div id="login-container">
        <h2>Streng geheim! 🔒</h2>
        <p>Gib das Passwort ein, um die Wunschliste zu öffnen.</p>
        <input type="password" id="password-input" placeholder="Passwort eingeben">
        <button id="login-btn" onclick="checkPassword()">Einloggen</button>
        <p id="error-msg">Falsches Passwort! ❌</p>
    </div>

    <!-- 2. INHALT -->
    <div id="content">
        <h1>Unsere Gaming-Wunschliste 🎮</h1>
        <p class="subtitle">Spiele, die wir zusammen zocken müssen</p>
        <div class="grid" id="games-grid"></div>
    </div>

    <!-- 3. LOGIK-SKRIPT -->
    <script>
        function checkPassword() {
            if (document.getElementById('password-input').value === "gaming") {
                document.getElementById('login-container').style.display = "none";
                document.getElementById('content').style.display = "flex";
                document.body.style.justifyContent = "flex-start";
                loadGames();
            } else {
                document.getElementById('error-msg').style.display = "block";
            }
        }

        function loadGames() {
            fetch('games.json')
                .then(res => res.json())
                .then(games => {
                    const grid = document.getElementById('games-grid');
                    grid.innerHTML = '';
                    games.forEach(game => {
                        // Liest die ID aus JEDEM Link heraus (Steam oder SteamDB)
                        const matches = game.url.match(/\/(?:app|id)\/(\d+)/) || game.url.match(/(\d+)/);
                        const steamId = (matches && matches[1]) ? matches[1] : '';
                        
                        // Nutzt die freie SteamDB-Bildquelle
                        const img = `https://steamdb.info{steamId}.jpg`;
                        
                        const tags = game.tags ? game.tags.map(t => `<span class="tag">${t}</span>`).join('') : '';
                        const badge = game.discountPercent > 0 ? `<div class="discount-badge">-${game.discountPercent}%</div>` : '';
                        const price = game.isReleaseSoon ? `<span class="coming-soon-price">${game.price}</span>` : `<span class="current-price ${game.discountPercent > 0 ? 'sale' : ''}">${game.price}</span>`;

                        grid.innerHTML += `
                            <div class="card">
                                <div class="image-wrapper">${badge}<img src="${img}" onerror="this.src='https://placeholder.com'"></div>
                                <div class="card-content">
                                    <div><h3 class="card-title">${game.title}</h3><div class="tags-container">${tags}</div></div>
                                    <div class="card-footer"><div>${price}</div><a href="${game.url}" target="_blank" class="steam-btn">Mehr Infos ➔</a></div>
                                </div>
                            </div>`;
                    });
                }).catch(() => grid.innerHTML = '<p>Fehler beim Laden. 😕</p>');
        }

        document.getElementById('password-input').addEventListener('keypress', e => { if (e.key === 'Enter') checkPassword(); });
    </script>
</body>
</html>
