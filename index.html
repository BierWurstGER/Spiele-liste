<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meine Spieleliste</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #171a21;
            color: white;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        #games {
            max-width: 1000px;
            margin: auto;
        }

        .game {
            display: flex;
            gap: 20px;
            background: #20242c;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 10px;
        }

        .game img {
            width: 200px;
            height: auto;
            object-fit: cover;
            border-radius: 5px;
        }

        .game-content {
            flex: 1;
        }

        .game h2 {
            margin-top: 0;
        }

        .genre {
            color: #66c0f4;
        }

        .description {
            color: #d6d7d8;
            line-height: 1.5;
        }

        .steam-button {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            background: #1a9fff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .steam-button:hover {
            background: #147dcc;
        }

        .error {
            background: #442222;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .game {
                flex-direction: column;
            }

            .game img {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <h1>🎮 Meine Spieleliste</h1>

    <div id="games">
        <p>Spiele werden geladen...</p>
    </div>

    <script>

        async function loadGames() {

            const gamesContainer = document.getElementById("games");

            try {

                // games.json laden
                const response = await fetch("games.json");

                if (!response.ok) {
                    throw new Error("games.json konnte nicht geladen werden.");
                }

                const games = await response.json();

                // Container leeren
                gamesContainer.innerHTML = "";

                // Jedes Spiel laden
                for (const game of games) {

                    await loadGame(game.appid, gamesContainer);

                }

            } catch (error) {

                gamesContainer.innerHTML = `
                    <div class="error">
                        Fehler beim Laden der Spiele:
                        ${error.message}
                    </div>
                `;

            }

        }


        async function loadGame(appid, container) {

            try {

                const response = await fetch(
                    `https://store.steampowered.com/api/appdetails?appids=${appid}&l=german`
                );

                if (!response.ok) {
                    throw new Error("Steam API nicht erreichbar");
                }

                const data = await response.json();

                const gameData = data[appid];

                if (!gameData || !gameData.success) {
                    throw new Error("Spiel wurde nicht gefunden");
                }

                const game = gameData.data;

                // Genres zusammenbauen
                let genres = "Keine Angabe";

                if (game.genres) {
                    genres = game.genres
                        .map(genre => genre.description)
                        .join(", ");
                }

                // Spielkarte erstellen
                const gameElement = document.createElement("div");

                gameElement.className = "game";

                gameElement.innerHTML = `

                    <img
                        src="${game.header_image}"
                        alt="${game.name}"
                    >

                    <div class="game-content">

                        <h2>${game.name}</h2>

                        <p class="genre">
                            ${genres}
                        </p>

                        <p class="description">
                            ${game.short_description || "Keine Beschreibung vorhanden."}
                        </p>

                        <a
                            class="steam-button"
                            href="https://store.steampowered.com/app/${appid}/"
                            target="_blank"
                        >
                            Auf Steam öffnen
                        </a>

                    </div>

                `;

                container.appendChild(gameElement);

            } catch (error) {

                const errorElement = document.createElement("div");

                errorElement.className = "error";

                errorElement.innerHTML = `
                    <strong>AppID ${appid}</strong>
                    konnte nicht geladen werden.
                    <br>
                    <small>${error.message}</small>
                `;

                container.appendChild(errorElement);

            }

        }


        // Webseite starten
        loadGames();

    </script>

</body>
</html>
