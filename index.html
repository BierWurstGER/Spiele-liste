<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsere Gaming-Wunschliste 🎮</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 100%);
            --panel-bg: rgba(30, 41, 59, 0.6);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.2);
            --sale-color: #f43f5e;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
            box-sizing: border-box;
        }
        #login-container {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            max-width: 380px;
            width: 100%;
        }
        #password-input {
            width: 100%;
            padding: 14px;
            margin: 15px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.6);
            color: white;
            border-radius: 12px;
            text-align: center;
            box-sizing: border-box;
        }
        #login-btn {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 14px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px var(--accent-glow);
        }
        #error-msg { color: #f87171; margin-top: 15px; display: none; }
        
        #content { display: none; width: 100%; max-width: 800px; flex-direction: column; align-items: center; }
        h1 { font-size: 2.5rem; margin: 0 0 8px 0; background: linear-gradient(to right, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: var(--text-muted); margin-bottom: 40px; }
        
        .list-container { width: 100%; display: flex; flex-direction: column; gap: 16px; }
        .game-row {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 20px 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
            gap: 20px;
        }
        .game-row:hover {
            transform: translateX(4px);
            border-color: rgba(255, 255, 255, 0.15);
        }
        .game-info { display: flex; flex-direction: column; gap: 4px; }
        .game-title { font-size: 1.25rem; font-weight: 700; margin: 0; }
        .game-price { font-size: 0.95rem; color: var(--text-muted); }
        .game-price.sale-active { color: var(--sale-color); font-weight: 600; }
        
        .steam-link-btn {
            background: #212429;
            color: #f8fafc;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
            white-space: nowrap;
            transition: background 0.2s;
        }
        .steam-link-btn:hover { background: #2f353d; }
    </style>
</head>
<body>

    <!-- 1. PASSWORT-BEREICH -->
    <div id="login-container">
        <h2>Streng geheim! 🔒</h2>
        <p>Gib das Passwort ein, um die Wunschliste zu öffnen.</p>
        <input type="password" id="password-input" placeholder="Passwort eingeben">
        <button id="login-btn" onclick="checkPassword()">Einloggen</button>
        <p id="error-msg">Falsches Passwort! ❌</p>
    </div>

    <!-- 2. INHALT -->
    <div id="content">
        <h1>Unsere Gaming-Wunschliste 🎮</h1>
        <p class="subtitle">Spiele, die wir zusammen zocken müssen</p>
        <div class="list-container" id="games-list"></div>
    </div>

    <!-- 3. LOGIK-SKRIPT -->
    <script>
        function checkPassword() {
            if (document.getElementById('password-input').value === "gaming") {
                document.getElementById('login-container').style.display = "none";
                document.getElementById('content').style.display = "flex";
                document.body.style.justifyContent = "flex-start";
                loadGames();
            } else {
                document.getElementById('error-msg').style.display = "block";
            }
        }

        function loadGames() {
            fetch('games.json')
                .then(res => res.json())
                .then(games => {
                    const list = document.getElementById('games-list');
                    list.innerHTML = '';
                    games.forEach(game => {
                        const priceClass = game.isSale ? 'game-price sale-active' : 'game-price';

                        list.innerHTML += `
                            <div class="game-row">
                                <div class="game-info">
                                    <h3 class="game-title">${game.title}</h3>
                                    <span class="${priceClass}">${game.price}</span>
                                </div>
                                <a href="${game.url}" target="_blank" class="steam-link-btn">Ansehen ➔</a>
                            </div>`;
                    });
                }).catch(() => document.getElementById('games-list').innerHTML = '<p>Fehler beim Laden. 😕</p>');
        }

        document.getElementById('password-input').addEventListener('keypress', e => { if (e.key === 'Enter') checkPassword(); });
    </script>
</body>
</html>
